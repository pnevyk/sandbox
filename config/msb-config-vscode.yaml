cpus: 2
memory: "8G"
workdir: "/home/sandbox/workspace"
user: "sandbox"
security: restricted
network:
  allow: [
    "api.github.com", # Needed for Copilot authentication instead of a token
    "api.individual.githubcopilot.com",
    "proxy.individual.githubcopilot.com",
    "api.business.githubcopilot.com",
    "proxy.business.githubcopilot.com",
    "api.enterprise.githubcopilot.com",
    "proxy.enterprise.githubcopilot.com",
    "api.githubcopilot.com",
    "proxy.githubcopilot.com",
  ]
  dns:
    rebind_protection: true
  tls:
    enabled: true
  strict: true
mounts:
  # Host's global agent skills
  - bind: "${HOME}/.agents/skills"
    target: "/home/sandbox/.agents/skills"
    noexec: true
    readonly: true
